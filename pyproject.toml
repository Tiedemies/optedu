[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optedu"
version = "0.1.0"
description = "Pedagogical optimization toolkit with running examples and visualizations."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Your Name", email = "you@example.com"}]
license = "MIT"
dependencies = [
  "numpy>=1.22",
  "matplotlib>=3.6"
]

[tool.setuptools]
# declare only this package
packages = ["optedu"]

# If you later add non-Python data files inside optedu/, configure include-package-data = true
# and MANIFEST.in or tool.setuptools.package-data accordingly.

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
optedu = { path = ".", editable = true }

[tool.pixi.tasks]
rosenbrock_gd = "python3 optimize.py configs/rosenbrock_gd.json -v"
lp_mixed_ineq = "python3 optimize.py configs/lp_mixed_ineq.json"
test = "pytest -q"
opt = "python3 optimize.py"

[tool.pixi.dependencies]
pytest = ">=9.0.2,<10"
