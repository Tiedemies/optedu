[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optedu"
version = "0.1.0"
description = "Pedagogical optimization toolkit with running examples and visualizations."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Henri Hansen"}]
license = "MIT"
dependencies = [
  "numpy>=1.22",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
# the optedu package and all its subpackages (algorithms, problems, utils, visuals)
include = ["optedu*"]
